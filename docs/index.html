<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- Safari対策: user-scalable=no + font-size>=16pxで入力時の自動拡大を防止 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spending-Log</title>
<meta name="app-version" content="0.5.4">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="sp-log">
<meta name="theme-color" content="#F7F7F5">
<style>
  :root{
    --c-green:#639922;
    --c-orange:#BA7517;
    --c-purple:#534AB7;
    --bg:#F7F7F5;
    --surface:#FFFFFF;
    --border:#E3E1DC;
    --border-strong:#C9C6BE;
    --text:#2B2A27;
    --text-sub:#726F68;
    --text-mute:#A8A49B;
    --danger:#B4232C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    /* Safariでの入力時自動拡大を防ぐため基準フォントを16px以上に */
    font-size:16px;
    -webkit-text-size-adjust:100%;
    /* 画面下部のスワイプ専用ゾーン(.swipe-zone, 高さ56px)の分だけ余白を確保 */
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  input,textarea,select{
    font-size:16px; /* Safari拡大防止の要 */
    font-family:inherit;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit; cursor:pointer;}

  header.app-header{
    padding:14px 16px 10px;
    background:var(--surface);
    border-bottom:0.5px solid var(--border);
    position:sticky; top:0; z-index:10;
  }
  header.app-header h1{font-size:15px; font-weight:600;}

  main{max-width:480px; margin:0 auto; padding:14px 12px;}

  /* 画面下部のスワイプ専用ゾーン(タブ切替) */
  .swipe-zone{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    height:56px; padding-bottom:env(safe-area-inset-bottom);
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border-top:0.5px solid var(--border);
  }
  .swipe-zone .swipe-handle{
    width:36px; height:4px; border-radius:2px; background:var(--border-strong);
  }

  /* タブバー */
  nav.tabbar{
    display:flex; gap:4px; margin-bottom:14px;
  }
  nav.tabbar button{
    flex:1; padding:9px 4px; font-size:12px; border-radius:var(--radius);
    border:0.5px solid var(--border); background:var(--surface); color:var(--text-sub);
  }
  nav.tabbar button.active{
    border-color:var(--border-strong); background:#3A3A3A; color:#fff; font-weight:500;
  }

  section.tab-panel{display:none;}
  section.tab-panel.active{display:block;}

  /* ===== タブ1 カレンダー ===== */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-header button{background:none; border:0; font-size:20px; color:var(--text-sub); padding:4px 10px;}
  .cal-title{font-size:14px; font-weight:600;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:10px; color:var(--text-mute); text-align:center; margin-bottom:4px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .cal-cell{
    aspect-ratio:1; border:0.5px solid var(--border); border-radius:6px; padding:3px;
    display:flex; flex-direction:column; background:var(--surface);
  }
  .cal-cell.other-month{visibility:hidden;}
  .cal-cell .day-num{font-size:10px; color:var(--text-sub); align-self:flex-start;}
  .cal-cell .amt-list{margin-top:auto; display:flex; flex-direction:column; gap:1px;}
  .cal-cell .amt-list span{font-size:8px; font-weight:600; line-height:1.1; text-align:left;}
  .cal-cell.today{border-color:var(--border-strong); border-width:1.2px;}
  /* 日付欄内: 数字部分=新規追加、小計ラベル部分=一覧表示 の当たり判定を分ける */
  .cal-cell .day-num-hit{width:100%; display:block; padding-bottom:2px;}
  .cal-cell .amt-list span{cursor:pointer;}

  /* ===== 入力フォーム(モーダル) ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none;
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:100%; max-width:480px; background:var(--surface); border-radius:16px 16px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-head span{font-size:14px; font-weight:600;}
  .modal-head button.close{background:none; border:0; font-size:18px; color:var(--text-sub);}
  .date-edit{display:flex; align-items:center; gap:6px; margin-bottom:14px;}
  .date-edit input[type=date]{flex:1; border:0.5px solid var(--border-strong); border-radius:var(--radius); padding:8px 10px;}

  .cat-row, .subcat-row{display:flex; gap:6px; margin-bottom:10px;}
  .cat-row button, .subcat-row button{
    flex:1; padding:10px 4px; font-size:12px; border-radius:var(--radius);
    border:0.5px solid var(--border-strong); background:transparent; color:var(--text);
  }
  .cat-row button.selected{color:#fff;}
  .subcat-row button.selected{color:#fff;}

  .amount-row{
    display:flex; align-items:center; border:0.5px solid var(--border-strong); border-radius:var(--radius);
    padding:10px 12px; margin-bottom:10px;
  }
  .amount-row span{font-size:14px; color:var(--text-sub); margin-right:4px;}
  .amount-row input{border:0; outline:0; background:transparent; width:100%;}

  textarea.memo{
    width:100%; border:0.5px solid var(--border-strong); border-radius:var(--radius);
    padding:8px 10px; resize:none; margin-bottom:6px; background:transparent; color:var(--text);
  }
  .memo-count{font-size:10px; color:var(--text-mute); text-align:right; margin-bottom:14px;}

  .action-row{display:flex; gap:8px; margin-bottom:10px;}
  .btn-record{
    flex:1; padding:12px; border:0; border-radius:var(--radius); font-size:13px; font-weight:600;
    background:var(--border); color:var(--text-mute);
  }
  .btn-record.enabled{background:#3A3A3A; color:#fff;}
  .btn-delete{
    width:72px; padding:12px; border:0.5px solid var(--danger); border-radius:var(--radius);
    font-size:12px; font-weight:600; background:transparent; color:var(--danger);
  }
  .missing-box{
    border:0.5px solid var(--danger); border-radius:var(--radius); padding:8px 10px;
    font-size:11px; color:var(--danger); display:flex; align-items:center; gap:6px;
  }

  /* ===== タブ2 円グラフ ===== */
  .section-title{font-size:13px; font-weight:600; margin-bottom:10px;}
  .divider{height:0.5px; background:var(--border); margin:16px 0;}
  .week-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .week-index{
    border:0.5px solid var(--border); border-radius:var(--radius); padding:10px;
    display:flex; flex-direction:column; justify-content:center; gap:6px;
  }
  .week-index-line{display:flex; justify-content:space-between; font-size:10px;}
  .week-index-line span:first-child{color:var(--text-sub);}
  .week-index-line span:last-child{font-weight:600;}
  .week-card{
    border:0.5px solid var(--border); border-radius:var(--radius); padding:8px;
    display:flex; flex-direction:column; align-items:center; cursor:pointer;
  }
  .week-card .wc-label{font-size:10px; color:var(--text-sub); margin-bottom:6px; text-align:center;}
  .week-card .wc-pie{width:56px; height:56px; border-radius:50%; margin-bottom:8px;}
  .week-card .wc-legend{display:flex; flex-direction:column; gap:2px; align-self:flex-start; font-size:9px;}
  .month-pie-row{display:flex; align-items:center; gap:16px; margin-bottom:10px; cursor:pointer;}
  .month-pie{width:100px; height:100px; border-radius:50%; flex-shrink:0; margin-left:auto;}
  .month-legend{font-size:11px; display:flex; flex-direction:column; gap:6px;}
  .month-total-row{display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:0.5px solid var(--border); font-size:12px; font-weight:600;}

  /* ===== タブ3 棒グラフ・履歴 ===== */
  .bar-chart-wrap{display:flex; align-items:end; gap:24px; padding-left:28px; position:relative; margin-bottom:8px; justify-content:center;}
  .bar-yaxis{position:absolute; left:0; top:0; bottom:18px; display:flex; flex-direction:column; justify-content:space-between; font-size:9px; color:var(--text-mute);}
  .bar-plot{display:flex; align-items:end; gap:24px; border-left:0.5px solid var(--border); border-bottom:0.5px solid var(--border); padding-left:10px;}
  .bar-col{display:flex; align-items:flex-end; gap:6px;}
  .bar-stack{width:26px; display:flex; flex-direction:column-reverse; cursor:pointer;}
  .bar-sub{display:flex; flex-direction:column; justify-content:flex-end; gap:1px; font-size:8px; white-space:nowrap;}
  .bar-mlabel{font-size:9px; color:var(--text-mute); margin-top:4px; text-align:center;}
  .bar-legend{display:flex; gap:12px; font-size:10px; margin-bottom:6px; padding-left:28px;}
  .bar-legend span{display:flex; align-items:center; gap:3px;}
  .bar-legend i{width:7px; height:7px; border-radius:1px; display:inline-block;}

  .history-list{border-top:0.5px solid var(--border);}
  .history-row{
    display:flex; justify-content:space-between; align-items:center; padding:9px 2px;
    border-bottom:0.5px solid var(--border); font-size:12px; cursor:pointer;
  }
  .history-scroll{max-height:150px; overflow-y:auto; border-top:0.5px solid var(--border);}
  .older-label{font-size:10px; color:var(--text-mute); margin:8px 0 6px;}

  /* ===== 内訳モーダル ===== */
  .detail-modal .modal-sheet{max-height:70vh;}
  .detail-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:0.5px solid var(--border); font-size:12px;}
  .detail-row .d-memo{color:var(--text-mute); font-size:10px;}

  .empty-msg{font-size:11px; color:var(--text-mute); text-align:center; padding:12px 0;}

  /* ===== 日別・大項目別レコード一覧モーダル ===== */
  .daylist-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 2px;
    border-bottom:0.5px solid var(--border); font-size:12px; cursor:pointer;
  }
  .daylist-row .dl-sub{color:var(--text-sub); font-size:11px;}
  .daylist-row .dl-amt{font-weight:600;}
  .daylist-add{
    width:100%; margin-top:12px; padding:10px; border-radius:var(--radius);
    border:0.5px dashed var(--border-strong); background:transparent; color:var(--text-sub); font-size:12px;
  }

  /* ===== 週間円グラフ: 小項目内訳(別画面) ===== */
  .sub-breakdown-grid{display:flex; flex-direction:column; gap:16px;}
  .sub-breakdown-cat{display:flex; align-items:center; gap:14px;}
  .sub-breakdown-pie{width:76px; height:76px; border-radius:50%; flex-shrink:0;}
  .sub-breakdown-info{flex:1;}
  .sub-breakdown-info .sb-title{font-size:12px; font-weight:600; margin-bottom:6px;}
  .sub-breakdown-info .sb-legend{display:flex; flex-direction:column; gap:3px; font-size:11px;}
</style>
</head>
<body>

<header class="app-header"><h1>Spending-Log</h1></header>

<main>
  <nav class="tabbar">
    <button data-tab="1" class="active">カレンダー</button>
    <button data-tab="2">週/月グラフ</button>
    <button data-tab="3">月/履歴</button>
  </nav>

  <!-- タブ1 -->
  <section class="tab-panel active" data-panel="1">
    <div class="cal-header">
      <button id="prevMonth" aria-label="前の月">‹</button>
      <span class="cal-title" id="calTitle"></span>
      <button id="nextMonth" aria-label="次の月">›</button>
    </div>
    <div class="cal-weekdays"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <!-- タブ2 -->
  <section class="tab-panel" data-panel="2">
    <div class="section-title">週間支出</div>
    <div class="week-grid" id="weekGrid"></div>
    <div class="divider"></div>
    <div class="section-title">月間支出</div>
    <div class="month-pie-row" id="monthPieRow">
      <div class="month-legend" id="monthLegend"></div>
      <div class="month-pie" id="monthPie"></div>
    </div>
    <div class="month-total-row"><span>月合計</span><span id="monthTotal">¥0</span></div>
  </section>

  <!-- タブ3 -->
  <section class="tab-panel" data-panel="3">
    <div class="section-title">履歴(月合計)</div>
    <div class="bar-legend">
      <span><i style="background:var(--c-green);"></i>光熱費</span>
      <span><i style="background:var(--c-orange);"></i>生活費</span>
      <span><i style="background:var(--c-purple);"></i>雑費</span>
    </div>
    <div class="bar-chart-wrap">
      <div class="bar-yaxis" id="barYAxis"></div>
      <div class="bar-plot" id="barPlot"></div>
    </div>
    <div class="divider"></div>
    <div class="older-label">それ以前の履歴</div>
    <div class="history-scroll" id="olderHistory"></div>
  </section>
</main>

<!-- 画面下部のスワイプ専用ゾーン(左右スワイプでタブ切替。全タブ共通) -->
<div class="swipe-zone" id="swipeZone" aria-hidden="true"><span class="swipe-handle"></span></div>

<!-- 入力/編集モーダル -->
<div class="modal-overlay" id="entryModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <span id="modalDateLabel"></span>
      <button class="close" id="closeModal">✕</button>
    </div>
    <div class="date-edit">
      <input type="date" id="dateInput">
    </div>
    <div class="cat-row" id="catRow"></div>
    <div class="subcat-row" id="subcatRow"></div>
    <div class="amount-row">
      <span>¥</span>
      <input type="number" inputmode="numeric" id="amountInput" placeholder="金額を入力">
    </div>
    <textarea class="memo" id="memoInput" maxlength="50" rows="2" placeholder="メモ(任意)"></textarea>
    <div class="memo-count" id="memoCount">0/50</div>
    <div class="action-row">
      <button class="btn-record" id="recordBtn" disabled>記録</button>
      <button class="btn-delete" id="deleteBtn" style="display:none;">削除</button>
    </div>
    <div class="missing-box" id="missingBox">未入力: <span id="missingList"></span></div>
  </div>
</div>

<!-- 日別・大項目別 レコード一覧モーダル(カレンダーの小計ラベルタップ用) -->
<div class="modal-overlay" id="dayListModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <span id="dayListTitle"></span>
      <button class="close" id="closeDayList">✕</button>
    </div>
    <div id="dayListBody"></div>
    <button class="daylist-add" id="dayListAdd">+ この大項目で追加</button>
  </div>
</div>

<!-- 週間/月間円グラフの小項目内訳(別画面) -->
<div class="modal-overlay" id="subBreakdownModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <span id="subBreakdownTitle"></span>
      <button class="close" id="closeSubBreakdown">✕</button>
    </div>
    <div class="sub-breakdown-grid" id="subBreakdownBody"></div>
  </div>
</div>

<!-- 内訳表示モーダル(タブ3履歴タップ用) -->
<div class="modal-overlay detail-modal" id="detailModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <span id="detailTitle"></span>
      <button class="close" id="closeDetail">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 削除確認ダイアログ -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-sheet" style="padding:20px 16px;">
    <p style="font-size:13px; margin-bottom:16px;">この記録を削除しますか?</p>
    <div class="action-row">
      <button class="btn-record" id="confirmCancel" style="background:var(--border); color:var(--text);">キャンセル</button>
      <button class="btn-record enabled" id="confirmOk" style="background:var(--danger);">削除する</button>
    </div>
  </div>
</div>

<script>
/* ===========================================================
   Spending-Log v0.1.0
   =========================================================== */

const CATS = {
  '光熱費': { color:'#639922', subs:['電気代','ガス代','水道代'] },
  '生活費': { color:'#BA7517', subs:['食費','日用品','外食費'] },
  '雑費':   { color:'#534AB7', subs:['コンビニ','交際費','交通費'] }
};
const CAT_ORDER = ['光熱費','生活費','雑費'];
const STORAGE_KEY = 'spendingLogRecords_v1';
// スワイプ関連のしきい値。
// タブ切替は画面下部の専用ゾーン(#swipeZone)、月切替はカレンダー内(#calGrid)と
// 領域が完全に分離しているため、しきい値はどちらも小さい値で素早く反応させられる。
const CAL_MONTH_SWIPE_MIN = 50;
const TAB_SWIPE_MIN = 50;

/* ---------- データ層 ---------- */
function loadRecords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveRecords(records){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  renderAll();
}
let records = loadRecords();

function genId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id_' + Date.now() + '_' + Math.random().toString(16).slice(2);
}
function nowIso(){ return new Date().toISOString(); }
function fmtYen(n){ return '¥' + Number(n).toLocaleString(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toDateStr(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }

/* ---------- 状態 ---------- */
const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth()+1; // 1-12
let editingId = null; // null=新規, それ以外=編集対象id

/* ---------- カレンダー生成 ---------- */
function getMonthMatrix(year, month){
  // month: 1-12。月曜始まりの週配列を返す。各セルは {date:'YYYY-MM-DD', inMonth:bool, day:number} か null
  const firstDay = new Date(year, month-1, 1);
  const lastDate = new Date(year, month, 0).getDate();
  // 月曜=0となるように調整
  const firstWeekday = (firstDay.getDay() + 6) % 7; // 0=月
  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=lastDate; d++){
    cells.push({ date: toDateStr(year, month, d), day: d });
  }
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7){
    weeks.push(cells.slice(i,i+7));
  }
  return weeks;
}

/* 5週丸めロジック: 当月分の日付のみを持つ週配列(短縮版)を返す */
function getRoundedWeeks(year, month){
  const weeks = getMonthMatrix(year, month).map(w => ({
    cells: w,
    days: w.filter(c => c !== null) // 当月分のみ(getMonthMatrixは既に当月のみ生成)
  }));
  // 週丸め: 常に5週に丸める。端数が少ない方を隣接週へ合算
  while(weeks.length > 5){
    if(weeks[0].days.length <= weeks[weeks.length-1].days.length){
      weeks[1].days = weeks[0].days.concat(weeks[1].days);
      weeks.shift();
    } else {
      const last = weeks.length-1;
      weeks[last-1].days = weeks[last-1].days.concat(weeks[last].days);
      weeks.pop();
    }
  }
  // ラベル(実日付範囲)を付与
  weeks.forEach(w => {
    if(w.days.length){
      const first = w.days[0].day, last = w.days[w.days.length-1].day;
      w.label = first === last ? `${month}/${first}` : `${month}/${first}〜${month}/${last}`;
    } else {
      w.label = '';
    }
  });
  return weeks;
}

/* ---------- 集計 ---------- */
function recordsInMonth(year, month){
  const prefix = `${year}-${pad2(month)}`;
  return records.filter(r => r.date.startsWith(prefix));
}
function sumByCategory(recs){
  const sum = {'光熱費':0,'生活費':0,'雑費':0};
  recs.forEach(r => { sum[r.category] = (sum[r.category]||0) + r.amount; });
  return sum;
}
function sumBySubCategory(recs, cat){
  const sum = {};
  (CATS[cat]?.subs || []).forEach(s => sum[s] = 0);
  recs.filter(r=>r.category===cat).forEach(r => {
    const key = r.subCategory || 'その他';
    sum[key] = (sum[key]||0) + r.amount;
  });
  return sum;
}
function total(sumObj){ return Object.values(sumObj).reduce((a,b)=>a+b,0); }

/* ---------- タブ1: カレンダー描画 ---------- */
function renderCalendar(){
  document.getElementById('calTitle').textContent = `${viewYear}年${viewMonth}月`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const weeks = getMonthMatrix(viewYear, viewMonth);
  const todayStr = toDateStr(today.getFullYear(), today.getMonth()+1, today.getDate());

  weeks.forEach(week => {
    week.forEach(cell => {
      const div = document.createElement('div');
      if(!cell){
        div.className = 'cal-cell other-month';
        grid.appendChild(div);
        return;
      }
      div.className = 'cal-cell' + (cell.date === todayStr ? ' today' : '');

      const dayNum = document.createElement('span');
      dayNum.className = 'day-num day-num-hit';
      dayNum.textContent = cell.day;
      // 日付の数字部分をタップ→常に新規追加
      dayNum.addEventListener('click', (e) => { e.stopPropagation(); openEntryModal(cell.date, null); });
      div.appendChild(dayNum);

      const dayRecords = records.filter(r => r.date === cell.date);
      if(dayRecords.length){
        // 大項目ごとの小計を表示(個々のレコードではなく集計)
        const daySum = sumByCategory(dayRecords);
        const list = document.createElement('div');
        list.className = 'amt-list';
        CAT_ORDER.forEach(cat => {
          if(!daySum[cat]) return;
          const s = document.createElement('span');
          s.style.color = CATS[cat].color;
          s.textContent = fmtYen(daySum[cat]);
          // 小計ラベルをタップ→その日・その大項目のレコード一覧(編集・追加)
          s.addEventListener('click', (e) => { e.stopPropagation(); openDayList(cell.date, cat); });
          list.appendChild(s);
        });
        div.appendChild(list);
      }
      grid.appendChild(div);
    });
  });
}
document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth--; if(viewMonth<1){ viewMonth=12; viewYear--; }
  renderAll();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth++; if(viewMonth>12){ viewMonth=1; viewYear++; }
  renderAll();
});
// カレンダー内のスワイプで月切替(タブ切替は画面下部の専用ゾーンに分離したため、
// ここでは月切替のみを考えればよい)
(function(){
  let touchStartX = null;
  const grid = document.getElementById('calGrid');
  grid.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
  grid.addEventListener('touchend', e => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > CAL_MONTH_SWIPE_MIN){
      if(dx < 0) document.getElementById('nextMonth').click();
      else document.getElementById('prevMonth').click();
    }
    touchStartX = null;
  });
})();

/* ---------- 入力/編集モーダル ---------- */
const entryModal = document.getElementById('entryModal');
let selectedCat = null, selectedSub = null;

function openEntryModal(dateStr, record, presetCat){
  editingId = record ? record.id : null;
  selectedCat = record ? record.category : (presetCat || null);
  selectedSub = record ? record.subCategory : null;

  document.getElementById('modalDateLabel').textContent = editingId ? '記録の編集' : '記録の追加';
  document.getElementById('dateInput').value = dateStr;
  document.getElementById('amountInput').value = record ? record.amount : '';
  document.getElementById('memoInput').value = record ? (record.memo||'') : '';
  document.getElementById('memoCount').textContent = (record?.memo?.length||0) + '/50';
  document.getElementById('deleteBtn').style.display = editingId ? 'block' : 'none';

  renderCatRow();
  renderSubcatRow();
  checkFormValid();
  entryModal.classList.add('open');
}
document.getElementById('closeModal').addEventListener('click', () => entryModal.classList.remove('open'));

function renderCatRow(){
  const row = document.getElementById('catRow');
  row.innerHTML = '';
  CAT_ORDER.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    if(selectedCat === cat){ btn.classList.add('selected'); btn.style.background = CATS[cat].color; }
    btn.addEventListener('click', () => {
      selectedCat = cat; selectedSub = null;
      renderCatRow(); renderSubcatRow(); checkFormValid();
    });
    row.appendChild(btn);
  });
}
function renderSubcatRow(){
  const row = document.getElementById('subcatRow');
  row.innerHTML = '';
  if(!selectedCat) return;
  CATS[selectedCat].subs.forEach(sub => {
    const btn = document.createElement('button');
    btn.textContent = sub;
    if(selectedSub === sub){ btn.classList.add('selected'); btn.style.background = CATS[selectedCat].color; }
    btn.addEventListener('click', () => {
      selectedSub = sub;
      renderSubcatRow();
    });
    row.appendChild(btn);
  });
}
document.getElementById('amountInput').addEventListener('input', checkFormValid);
document.getElementById('memoInput').addEventListener('input', e => {
  document.getElementById('memoCount').textContent = e.target.value.length + '/50';
});

function checkFormValid(){
  const amount = document.getElementById('amountInput').value;
  const missing = [];
  if(!selectedCat) missing.push('大項目');
  if(!amount || Number(amount) <= 0) missing.push('金額');
  const btn = document.getElementById('recordBtn');
  const box = document.getElementById('missingBox');
  if(missing.length === 0){
    btn.disabled = false; btn.classList.add('enabled');
    box.style.display = 'none';
  } else {
    btn.disabled = true; btn.classList.remove('enabled');
    box.style.display = 'flex';
    document.getElementById('missingList').textContent = missing.join('・');
  }
}

document.getElementById('recordBtn').addEventListener('click', () => {
  const date = document.getElementById('dateInput').value;
  const amount = Math.floor(Number(document.getElementById('amountInput').value));
  const memo = document.getElementById('memoInput').value.slice(0,50);
  if(!date || !selectedCat || !amount || amount <= 0) return;

  if(editingId){
    const rec = records.find(r => r.id === editingId);
    if(rec){
      rec.date = date; rec.category = selectedCat; rec.subCategory = selectedSub || null;
      rec.amount = amount; rec.memo = memo; rec.updatedAt = nowIso();
    }
  } else {
    records.push({
      id: genId(), date, category: selectedCat, subCategory: selectedSub || null,
      amount, memo, createdAt: nowIso(), updatedAt: nowIso()
    });
  }
  // 編集で月をまたいだ場合は表示月を移動
  const [y,m] = date.split('-').map(Number);
  viewYear = y; viewMonth = m;

  saveRecords(records);
  entryModal.classList.remove('open');
});

/* 削除 */
const confirmModal = document.getElementById('confirmModal');
document.getElementById('deleteBtn').addEventListener('click', () => confirmModal.classList.add('open'));
document.getElementById('confirmCancel').addEventListener('click', () => confirmModal.classList.remove('open'));
document.getElementById('confirmOk').addEventListener('click', () => {
  records = records.filter(r => r.id !== editingId);
  saveRecords(records);
  confirmModal.classList.remove('open');
  entryModal.classList.remove('open');
});

/* ---------- タブ2: 円グラフ ---------- */
function conicGradient(sumObj, order){
  const t = total(sumObj);
  if(t === 0) return 'var(--border)';
  let acc = 0; const stops = [];
  order.forEach(cat => {
    const v = sumObj[cat] || 0;
    const pct = v / t * 100;
    if(pct > 0){ stops.push(`${CATS[cat] ? CATS[cat].color : '#999'} ${acc}% ${acc+pct}%`); acc += pct; }
  });
  return `conic-gradient(${stops.join(',')})`;
}

function renderTab2(){
  const monthRecs = recordsInMonth(viewYear, viewMonth);
  const weeks = getRoundedWeeks(viewYear, viewMonth);

  const weekGrid = document.getElementById('weekGrid');
  weekGrid.innerHTML = '';

  // インデックス枠
  const idxCell = document.createElement('div');
  idxCell.className = 'week-index';
  weeks.forEach(w => {
    const recs = monthRecs.filter(r => w.days.some(d => d.date === r.date));
    const sum = sumByCategory(recs);
    const line = document.createElement('div');
    line.className = 'week-index-line';
    line.innerHTML = `<span>${w.label}</span><span>${fmtYen(total(sum))}</span>`;
    idxCell.appendChild(line);
  });
  weekGrid.appendChild(idxCell);

  // 週カード
  weeks.forEach((w, idx) => {
    const recs = monthRecs.filter(r => w.days.some(d => d.date === r.date));
    const sum = sumByCategory(recs);
    const t = total(sum);
    const card = document.createElement('div');
    card.className = 'week-card';

    const pieBg = conicGradient(sum, CAT_ORDER);
    let legendHtml;
    if(t === 0){ legendHtml = '<span style="color:var(--text-mute);">支出なし(0%)</span>'; }
    else{
      legendHtml = CAT_ORDER.map(cat => {
        const v = sum[cat]||0; const pct = Math.round(v/t*100); const active = v>0;
        return `<span style="color:${active?CATS[cat].color:'var(--text-mute)'};opacity:${active?1:0.4};">¥${v.toLocaleString()}(${pct}%)</span>`;
      }).join('');
    }

    card.innerHTML = `<div class="wc-label">${w.label}</div>
      <div class="wc-pie" style="background:${pieBg};"></div>
      <div class="wc-legend">${legendHtml}</div>`;
    // タップで別画面(小項目内訳)を表示
    card.addEventListener('click', () => openSubBreakdown(w.label, recs));
    weekGrid.appendChild(card);
  });

  // 月間円グラフ
  const monthSum = sumByCategory(monthRecs);
  const monthT = total(monthSum);
  document.getElementById('monthPie').style.background = conicGradient(monthSum, CAT_ORDER);
  document.getElementById('monthLegend').innerHTML = CAT_ORDER.map(cat => {
    const v = monthSum[cat]||0; const pct = monthT ? Math.round(v/monthT*100) : 0;
    return `<span style="display:flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:2px;background:${CATS[cat].color};display:inline-block;"></span>${cat} ¥${v.toLocaleString()}(${pct}%)</span>`;
  }).join('');
  document.getElementById('monthTotal').textContent = fmtYen(monthT);
  // 月間円グラフもタップで小項目内訳を表示
  document.getElementById('monthPieRow').onclick = () => openSubBreakdown(`${viewYear}年${viewMonth}月`, monthRecs);
}

/* 週/月の円グラフをタップした際、大項目ごとに小項目別の円グラフへさらに分割して別画面表示 */
function openSubBreakdown(label, recs){
  document.getElementById('subBreakdownTitle').textContent = label + 'の内訳';
  const body = document.getElementById('subBreakdownBody');
  body.innerHTML = '';
  CAT_ORDER.forEach(cat => {
    const subSum = sumBySubCategory(recs, cat);
    const subTotal = total(subSum);
    const row = document.createElement('div');
    row.className = 'sub-breakdown-cat';

    let pieBg, legendHtml;
    if(subTotal === 0){
      pieBg = 'var(--border)';
      legendHtml = '<span style="color:var(--text-mute);">支出なし(0%)</span>';
    } else {
      let acc = 0; const stops = [];
      const shades = [1, 0.7, 0.45];
      Object.keys(subSum).forEach((s,i) => {
        const v = subSum[s]; const pct = v/subTotal*100;
        if(pct > 0){
          stops.push(`color-mix(in srgb, ${CATS[cat].color} ${shades[i%3]*100}%, white) ${acc}% ${acc+pct}%`);
          acc += pct;
        }
      });
      pieBg = `conic-gradient(${stops.join(',')})`;
      legendHtml = Object.keys(subSum).filter(s=>subSum[s]>0).map((s,i) => {
        const v = subSum[s]; const pct = Math.round(v/subTotal*100);
        return `<span style="display:flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;border-radius:2px;background:color-mix(in srgb, ${CATS[cat].color} ${shades[Object.keys(subSum).indexOf(s)%3]*100}%, white);display:inline-block;"></span>${s} ¥${v.toLocaleString()}(${pct}%)</span>`;
      }).join('') || '<span style="color:var(--text-mute);">支出なし</span>';
    }

    row.innerHTML = `<div class="sub-breakdown-pie" style="background:${pieBg};"></div>
      <div class="sub-breakdown-info">
        <div class="sb-title" style="color:${CATS[cat].color};">${cat} ${fmtYen(subTotal)}</div>
        <div class="sb-legend">${legendHtml}</div>
      </div>`;
    body.appendChild(row);
  });
  document.getElementById('subBreakdownModal').classList.add('open');
}
document.getElementById('closeSubBreakdown').addEventListener('click', () => document.getElementById('subBreakdownModal').classList.remove('open'));

/* ---------- タブ3: 棒グラフ・履歴 ---------- */
function getMonthKey(y,m){ return `${y}-${pad2(m)}`; }
function monthLabel(y,m){ return `${y}年${m}月`; }
function shiftMonth(y,m,delta){
  let mm = m + delta, yy = y;
  while(mm < 1){ mm += 12; yy--; }
  while(mm > 12){ mm -= 12; yy++; }
  return [yy, mm];
}

function detailModalForMonth(y, m){
  const recs = recordsInMonth(y, m);
  const sum = sumByCategory(recs);
  document.getElementById('detailTitle').textContent = monthLabel(y,m) + 'の内訳';
  const body = document.getElementById('detailBody');
  body.innerHTML = CAT_ORDER.map(cat => {
    const subSum = sumBySubCategory(recs, cat);
    const subHtml = Object.keys(subSum).filter(s=>subSum[s]>0).map(s =>
      `<div class="detail-row"><span style="padding-left:12px;">${s}</span><span>${fmtYen(subSum[s])}</span></div>`
    ).join('') || `<div class="detail-row"><span style="padding-left:12px;color:var(--text-mute);">記録なし</span><span></span></div>`;
    return `<div class="detail-row" style="font-weight:600;"><span style="color:${CATS[cat].color};">${cat}</span><span>${fmtYen(sum[cat]||0)}</span></div>${subHtml}`;
  }).join('');
  document.getElementById('detailModal').classList.add('open');
}
document.getElementById('closeDetail').addEventListener('click', () => document.getElementById('detailModal').classList.remove('open'));

function renderTab3(){
  // 直近3ヶ月(表示中の月を基準に3ヶ月分)
  const months = [];
  for(let i=2;i>=0;i--) months.push(shiftMonth(viewYear, viewMonth, -i));

  const monthData = months.map(([y,m]) => {
    const sum = sumByCategory(recordsInMonth(y,m));
    return { y, m, sum, total: total(sum) };
  });

  const maxVal = Math.max(300000, ...monthData.map(d=>d.total));
  // 目盛りを綺麗な単位に丸める(10万単位)
  const axisMax = Math.ceil(maxVal / 100000) * 100000;
  const axisSteps = 3; // 0,1/3,2/3,max の4段階相当だが10万単位優先
  const yAxis = document.getElementById('barYAxis');
  const labels = [];
  for(let v = axisMax; v >= 0; v -= axisMax/3){ labels.push(v); }
  yAxis.innerHTML = labels.map(v => `<span>${v>=10000 ? Math.round(v/10000)+'万' : v}</span>`).join('');

  const plot = document.getElementById('barPlot');
  plot.style.height = '190px';
  plot.innerHTML = '';
  const plotHeight = 190;

  monthData.forEach(d => {
    const col = document.createElement('div');
    col.className = 'bar-col';

    const barWrap = document.createElement('div');
    barWrap.className = 'bar-stack';
    barWrap.style.height = (d.total/axisMax*plotHeight) + 'px';
    // 積み上げ順(下から): 光熱費, 生活費, 雑費
    CAT_ORDER.forEach(cat => {
      const seg = document.createElement('div');
      const h = (d.sum[cat]||0)/axisMax*plotHeight;
      seg.style.cssText = `height:${h}px;background:${CATS[cat].color};width:100%;`;
      barWrap.appendChild(seg);
    });
    barWrap.addEventListener('click', () => detailModalForMonth(d.y, d.m));

    const barCol = document.createElement('div');
    barCol.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    const lbl = document.createElement('div');
    lbl.className = 'bar-mlabel';
    lbl.textContent = `'${String(d.y).slice(2)}/${d.m}月`;
    barCol.appendChild(barWrap);
    barCol.appendChild(lbl);

    // 小計(上から 雑費/生活費/光熱費)
    const subtotals = document.createElement('div');
    subtotals.className = 'bar-sub';
    subtotals.style.height = (d.total/axisMax*plotHeight) + 'px';
    ['雑費','生活費','光熱費'].forEach(cat => {
      const v = d.sum[cat]||0;
      const span = document.createElement('span');
      span.style.color = CATS[cat].color;
      span.textContent = v>0 ? fmtYen(v) : '';
      subtotals.appendChild(span);
    });

    col.appendChild(barCol);
    col.appendChild(subtotals);
    plot.appendChild(col);
  });

  // 履歴欄: 直近3ヶ月は上のグラフと統合表示なので、それ以前をリスト表示
  const older = document.getElementById('olderHistory');
  older.innerHTML = '';
  const seenKeys = new Set(monthData.map(d=>getMonthKey(d.y,d.m)));
  // 過去24ヶ月分をスキャンして記録がある月を抽出
  const allMonthTotals = [];
  for(let i=3;i<=24;i++){
    const [y,m] = shiftMonth(viewYear, viewMonth, -i);
    const key = getMonthKey(y,m);
    if(seenKeys.has(key)) continue;
    const recs = recordsInMonth(y,m);
    if(recs.length === 0) continue;
    allMonthTotals.push({y,m,total: total(sumByCategory(recs))});
  }
  if(allMonthTotals.length === 0){
    older.innerHTML = '<div class="empty-msg">それ以前の記録はありません</div>';
  } else {
    allMonthTotals.forEach(d => {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `<span>${monthLabel(d.y,d.m)}</span><span>${fmtYen(d.total)} ›</span>`;
      row.addEventListener('click', () => detailModalForMonth(d.y, d.m));
      older.appendChild(row);
    });
  }
}

/* ---------- タブ切替 ---------- */
const TAB_IDS = ['1','2','3'];
function switchTab(tabId){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.dataset.panel === tabId));
}
document.querySelectorAll('.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function anyModalOpen(){
  return !!document.querySelector('.modal-overlay.open');
}
function currentTabId(){
  return document.querySelector('.tabbar button.active').dataset.tab;
}

/* 画面下部の専用ゾーン(#swipeZone)でのスワイプでタブ切替。
   タブの中身(カレンダー等)とは領域が完全に分離しているため、
   全タブで共通の同じ挙動になる。モーダル表示中は対象外。 */
(function(){
  const zone = document.getElementById('swipeZone');
  let startX = null, startY = null;

  zone.addEventListener('touchstart', e => {
    if(anyModalOpen()) { startX = null; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });
  zone.addEventListener('touchend', e => {
    if(startX === null || anyModalOpen()){ startX = null; return; }
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // 横方向優位のスワイプのみをタブ切替とみなす(縦との誤反応防止)
    if(Math.abs(dx) > TAB_SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.5){
      const idx = TAB_IDS.indexOf(currentTabId());
      let nextIdx = dx < 0 ? idx + 1 : idx - 1;
      nextIdx = Math.max(0, Math.min(TAB_IDS.length - 1, nextIdx));
      if(nextIdx !== idx) switchTab(TAB_IDS[nextIdx]);
    }
    startX = null;
  });
})();

/* ---------- 全体描画 ---------- */
function renderAll(){
  renderCalendar();
  renderTab2();
  renderTab3();
}
renderAll();
